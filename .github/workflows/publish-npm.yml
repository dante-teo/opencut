name: Publish OpenCut to npm

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published stable GitHub release tag, such as v0.5.0
        required: true
        type: string

permissions: {}

concurrency:
  group: opencut-npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'dante-teo/opencut' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.12.0'
      - name: Download and verify the Homebrew release archive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Supply a stable release tag in vMAJOR.MINOR.PATCH format."
            exit 1
          fi
          if [[ "$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)" != "$RELEASE_TAG" ]]; then
            echo "::error::The tag must be the latest stable GitHub release."
            exit 1
          fi
          version="${RELEASE_TAG#v}"
          archive="opencut-cli-$version-macos-arm64.tgz"
          release_dir="$RUNNER_TEMP/opencut-npm-release"
          mkdir "$release_dir"
          cd "$release_dir"
          gh release download "$RELEASE_TAG" --repo "$GH_REPO" \
            --pattern "$archive" --pattern SHA256SUMS --pattern opencut.rb
          digest="$(awk -v archive="$archive" '$2 == archive || $2 == "./" archive {print $1}' SHA256SUMS)"
          if [[ ! "$digest" =~ ^[a-f0-9]{64}$ ]]; then
            echo "::error::Expected exactly one SHA-256 checksum for the CLI archive."
            exit 1
          fi
          computed="$(sha256sum "$archive")"
          if [[ "${computed%% *}" != "$digest" ]]; then
            echo "::error::The CLI archive does not match the release checksum."
            exit 1
          fi
          grep -Fxq "  sha256 \"$digest\"" opencut.rb
          grep -Fxq "  url \"https://github.com/$GH_REPO/releases/download/$RELEASE_TAG/$archive\"" opencut.rb
          tar -xOzf "$archive" package/package.json | jq -e \
            --arg version "$version" --arg repository "git+https://github.com/$GH_REPO.git" \
            '.name == "@dantea/opencut" and .version == $version and .repository.url == $repository' >/dev/null
          {
            echo "OPENCUT_VERSION=$version"
            echo "OPENCUT_ARCHIVE=$release_dir/$archive"
          } >> "$GITHUB_ENV"
      - name: Publish the verified archive with npm Trusted Publishing
        shell: bash
        working-directory: ${{ runner.temp }}/opencut-npm-release
        run: |
          expected="sha512-$(openssl dgst -sha512 -binary "$OPENCUT_ARCHIVE" | openssl base64 -A)"
          metadata="$(curl -fsS --retry 2 --max-time 10 -H 'Cache-Control: no-cache' \
            "https://registry.npmjs.org/@dantea%2Fopencut?check=$(date +%s)")"
          published="$(jq -r --arg version "$OPENCUT_VERSION" '.versions[$version].dist.integrity // empty' <<< "$metadata")"
          current_latest="$(jq -r '.["dist-tags"].latest // empty' <<< "$metadata")"
          if [[ "$(printf '%s\n' "$current_latest" "$OPENCUT_VERSION" | sort -V | tail -1)" != "$OPENCUT_VERSION" ]]; then
            echo "::error::npm latest already points to a newer version ($current_latest)."
            exit 1
          fi
          if [[ -n "$published" ]]; then
            if [[ "$published" != "$expected" || "$current_latest" != "$OPENCUT_VERSION" ]]; then
              echo "::error::The existing npm version has a different archive or is not tagged latest."
              exit 1
            fi
            echo "Already published @dantea/opencut@$OPENCUT_VERSION as latest with matching registry integrity."
            printf 'Already published @dantea/opencut@%s with matching registry integrity.\n' \
              "$OPENCUT_VERSION" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          corepack pnpm@11.20.0 publish "$OPENCUT_ARCHIVE" --access public --tag latest --registry=https://registry.npmjs.org
          echo "npm accepted @dantea/opencut@$OPENCUT_VERSION."
          printf 'Submitted @dantea/opencut@%s to npm. npm completes registry validation separately.\n' \
            "$OPENCUT_VERSION" >> "$GITHUB_STEP_SUMMARY"
