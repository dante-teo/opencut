name: OpenCut release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the GitHub release assets for Homebrew
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
  HOMEBREW_NO_AUTO_UPDATE: '1'

jobs:
  prepare:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - name: Check release ref
        env:
          PUBLISH_RELEASE: ${{ inputs.publish }}
        run: |
          test "$(uname -m)" = arm64
          version="$(node -p 'require("./package.json").version')"
          if [[ "$PUBLISH_RELEASE" == true || "$GITHUB_REF_TYPE" == tag ]]; then
            test "$GITHUB_REF" = "refs/tags/v$version"
          fi
          xcodebuild -version
      - name: Install locked build dependencies
        run: |
          corepack enable pnpm
          pnpm install --frozen-lockfile
          brew install ffmpeg
          rustup toolchain install stable --profile minimal --component clippy --component rustfmt
          rustup override set stable
      - name: Install pinned graphics browser
        run: |
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/opencut-playwright"
          echo "PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV"
          pnpm --filter @opencut/graphics exec playwright-core install chromium
      - name: Validate
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
          cargo build --workspace --release --locked
          pnpm build
          pnpm typecheck
          pnpm lint
          pnpm format:check
          pnpm fixtures:generate
          python3 tests/reference-motion/fixtures.py --adapters-only
          pnpm fixtures:validate
          pnpm test:fixtures
          pnpm test
          pnpm test:media
          pnpm test:conformance
          pnpm test:consistency
      - name: Build and test the release artifacts
        run: |
          pnpm release:pack
          bash scripts/release/test-brew.sh dist/release/opencut-cli-*.tgz dist/release/opencut.rb
          cd dist/release
          shasum -a 256 -c SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: distribution
          path: dist/release/
          if-no-files-found: error
          compression-level: 0

  publish:
    if: inputs.publish
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release-publish
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: distribution
          path: distribution
      - name: Verify release assets and publish the selected tag
        working-directory: distribution
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sha256sum -c SHA256SUMS
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release already exists. Choose a new version." >&2
            exit 1
          fi
          echo "Install with \`brew install dante-teo/tap/opencut\`. See the [installation guide](https://github.com/$GH_REPO/blob/$GITHUB_REF_NAME/docs/INSTALL.md) and verify the downloads with SHA256SUMS." > "$RUNNER_TEMP/release-notes"
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "OpenCut $GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/release-notes" SHA256SUMS opencut.rb ./*.tgz
